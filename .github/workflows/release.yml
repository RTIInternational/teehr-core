name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the package and publishes it to PyPI
# with trusted publishing (no token): PyPI's publisher for this repo names this workflow
# and the `pypi` environment.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Tag matches the version
        run: |
          version=$(uv version --short)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} isn't v${version} (pyproject.toml)"; exit 1; }
      - name: Test
        run: uv sync --locked --all-extras && uv run pytest -q
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

[project]
name = "teehr-core"
version = "0.0.1"
description = "Dependency-light core of TEEHR: data model, metric kernels, metric state, bootstrap and the evaluation spec engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "RTI International" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=2.2",
    "pyarrow>=21",
    "pydantic>=2.11",
    "sqlglot>=26",
]

[project.optional-dependencies]
# The spec engine: inputs, pairing, fields, filter and grouping as SQL.
engine = ["duckdb>=1.2"]

[project.urls]
Repository = "https://github.com/RTIInternational/teehr-core"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teehr_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
